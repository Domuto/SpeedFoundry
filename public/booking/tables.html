<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tongue &amp; Groove Atlanta — Choose Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0c1030; --panel:#141a42; --line:#2a3170;
    --gold:#f15a29; --champ:#efeadd; --ink:#efeadd; --dim:#b7bedd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;min-height:100%}

  header{padding:26px 16px 0;text-align:center}
  .mark{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(26px,5vw,44px);
    color:var(--champ);letter-spacing:.1em;text-transform:uppercase}
  .mark span{color:var(--gold)}
  .tag{margin-top:6px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
  .rule{width:min(680px,80%);height:1px;margin:16px auto 0;
    background:linear-gradient(90deg,transparent,rgba(239,234,221,.35),transparent)}

  /* tabs */
  .tabs{display:flex;justify-content:center;gap:10px;margin:18px auto 14px}
  .tab{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.22em;font-size:11px;
    padding:12px 22px;border-radius:3px;border:1px solid rgba(239,234,221,.5);cursor:pointer;
    text-transform:uppercase;background:transparent;color:var(--champ);transition:.3s}
  .tab.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .tab:not(.active):hover{border-color:var(--gold);color:var(--gold)}

  /* stage / iframes */
  .stage{max-width:1180px;margin:0 auto;padding:0 12px 130px}
  .frameWrap{position:relative;border:1px solid rgba(239,234,221,.1);border-radius:3px;overflow:hidden;
    background:#0a0d26;box-shadow:0 24px 70px #000a}
  iframe{display:block;width:100%;border:0;background:#0a0d26}
  #fr3d{height:min(72vh,760px)}
  #frMap{height:min(78vh,860px);display:none}

  /* ---- upcoming nights (Celestia-style card rail) ---- */
  .nightsWrap{max-width:1180px;margin:26px auto 30px;padding:0 12px}
  .nightsLabel{font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);margin:0 4px 14px}
  .nights{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch}
  .nights::-webkit-scrollbar{height:8px}
  .nights::-webkit-scrollbar-track{background:transparent}
  .nights::-webkit-scrollbar-thumb{background:#2a3170;border-radius:4px}
  .night{position:relative;flex:0 0 280px;scroll-snap-align:start;border:1.5px solid rgba(239,234,221,.18);
    border-radius:3px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;
    transition:border-color .3s,transform .3s}
  .night:hover{border-color:var(--gold);transform:translateY(-3px)}
  .night img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
  .nightBody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
  .nightTitle{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--champ)}
  .nightDay{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .nightDesc{font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:2px}
  .nightBtn{margin-top:12px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    padding:10px 16px;border:1px solid rgba(239,234,221,.5);border-radius:999px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;background:rgba(12,16,48,.6);color:var(--champ);transition:.3s;
    text-decoration:none}
  .nightBtn:hover{border-color:var(--gold);color:var(--gold)}
  .nightBtn .spark{color:var(--gold)}

  .backLink{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;
    border:1px solid rgba(239,234,221,.45);border-radius:3px;font-size:11px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--champ);text-decoration:none;transition:.3s}
  .backLink:hover{color:var(--gold);border-color:var(--gold)}
  .hint{margin-top:10px;text-align:center;color:var(--dim);opacity:.7;font-size:11px;letter-spacing:.22em}

  /* selection bar */
  #selBar{position:fixed;left:50%;bottom:-120px;transform:translateX(-50%);width:min(720px,94vw);
    display:flex;align-items:center;gap:14px;padding:14px 18px;z-index:40;
    background:rgba(20,26,66,.95);border:1px solid rgba(239,234,221,.15);
    border-radius:3px;backdrop-filter:blur(10px);box-shadow:0 14px 50px #000c;
    transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
  #selBar.open{bottom:14px}
  #selDot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
  #selName{font-family:'Anton',sans-serif;font-weight:400;color:var(--champ);font-size:16.5px;letter-spacing:.06em;text-transform:uppercase}
  #selMeta{color:var(--dim);font-size:12.5px;letter-spacing:.05em;margin-top:1px}
  #selBtn{margin-left:auto;flex:none;padding:12px 20px;border:1px solid var(--gold);border-radius:3px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.22em;font-size:11px;text-transform:uppercase;
    background:var(--gold);color:var(--bg);transition:.3s}
  #selBtn:hover{background:var(--champ);border-color:var(--champ)}
  #selBtn:active{transform:scale(.97)}

  /* modal */
  #veil{position:fixed;inset:0;background:rgba(12,16,48,.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  #veil.open{display:flex}
  #modal{width:min(520px,100%);background:var(--panel);max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border:1px solid rgba(239,234,221,.15);border-radius:3px;padding:24px;box-shadow:0 30px 90px #000}
  #mTitle{font-family:'Anton',sans-serif;font-weight:400;color:var(--champ);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
  #mSub{color:var(--dim);font-size:13px;margin-top:4px;letter-spacing:.04em}
  #mForm{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fw{grid-column:1/-1}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--gold);margin-bottom:5px;text-transform:uppercase}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid rgba(239,234,221,.25);border-radius:3px;
    color:var(--ink);padding:10px 12px;font-family:'Archivo',sans-serif;font-size:14px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:64px}
  #mSend{grid-column:1/-1;margin-top:4px;padding:14px;border:1px solid var(--gold);border-radius:3px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.22em;font-size:12px;text-transform:uppercase;
    background:var(--gold);color:var(--bg);transition:.3s}
  #mSend:hover{background:var(--champ);border-color:var(--champ)}
  #mX{flex:none;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid rgba(239,234,221,.35);color:var(--dim);border-radius:3px;
    width:30px;height:30px;cursor:pointer;line-height:1;margin-left:auto}
  .mHead{display:flex;align-items:flex-start;gap:10px}
  .err{border-color:#ff5470!important}

  /* toast */
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-90px);
    background:var(--panel);border:1px solid var(--gold);color:var(--champ);padding:12px 24px;border-radius:3px;
    font-size:13.5px;letter-spacing:.06em;transition:transform .3s;z-index:70;box-shadow:0 8px 30px #000a;
    max-width:92vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="mark">TONGUE <span>&amp;</span> GROOVE</div>
  <div class="tag">Choose Your Table · 3D Walkthrough &amp; 2D Floor Map</div>
  <div class="rule"></div>
  <a class="backLink" href="/booking/index.html">← Back to Booking Home</a>
</header>

<div class="tabs">
  <button class="tab active" id="tab3d">3D WALKTHROUGH</button>
  <button class="tab" id="tabMap">2D FLOOR MAP</button>
</div>

<div class="stage" id="pickers">
  <div class="frameWrap">
    <iframe id="fr3d"  src="tng-vip-3d.html?embed=1"  title="3D venue walkthrough"></iframe>
    <iframe id="frMap" src="tng-vip-map.html?embed=1" title="2D floor map"></iframe>
  </div>
  <div class="hint" id="hint">DRAG TO ORBIT · SCROLL TO ZOOM · TAP A TABLE TO SELECT</div>
</div>

<!-- selection bar -->
<div id="selBar">
  <div id="selDot"></div>
  <div>
    <div id="selName">—</div>
    <div id="selMeta">—</div>
  </div>
  <button id="selBtn">REQUEST</button>
</div>

<!-- request modal -->
<div id="veil">
  <div id="modal">
    <div class="mHead">
      <div>
        <div id="mTitle">Request a Section</div>
        <div id="mSub">—</div>
      </div>
      <button id="mX" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="mForm">
      <div><label for="fName">Name *</label><input id="fName" autocomplete="name"></div>
      <div><label for="fPhone">Phone *</label><input id="fPhone" inputmode="tel" autocomplete="tel"></div>
      <div class="fw"><label for="fEmail">Email</label><input id="fEmail" inputmode="email" autocomplete="email"></div>
      <div><label for="fParty">Party Size</label><input id="fParty" inputmode="numeric" placeholder="8"></div>
      <div><label for="fDate">Date</label><input id="fDate" type="date"></div>
      <div class="fw">
        <label for="fPromoter">Promoter</label>
        <select id="fPromoter">
          <option value="">Select promoter</option>
          <option value="Joseph Tran">Joseph Tran</option>
          <option value="Mia Carter">Mia Carter</option>
          <option value="Andre Lewis">Andre Lewis</option>
          <option value="Sofia Nguyen">Sofia Nguyen</option>
          <option value="Marcus Reed">Marcus Reed</option>
        </select>
      </div>
      <div class="fw"><label for="fNotes">Notes / Occasion</label><textarea id="fNotes" placeholder="Birthday, bottle preferences, arrival time…"></textarea></div>
      <button id="mSend">SEND REQUEST</button>
    </div>
  </div>
</div>

<div id="toast">Request received</div>

<script>
/* ============ SECTION DATA — keep in sync with tng-vip-3d.html / tng-vip-map.html ============ */
const CATS={
  center:{label:'Center Booth',      color:'#F2C14E',pax:12,min:2500},
  stage: {label:'Stage Table',       color:'#FF3D8D',pax:10,min:2000},
  dance: {label:'Dance Floor Table', color:'#2DD4CF',pax:8, min:1500},
  front: {label:'Front Room Table',  color:'#A78BFA',pax:8, min:1200},
  patio: {label:'Patio Section',     color:'#4ADE80',pax:10,min:1000},
  rail:  {label:'Balcony Rail Booth',color:'#FB923C',pax:8, min:1800},
  up:    {label:'Upstairs Lounge',   color:'#60A5FA',pax:6, min:800}
};
const SECTIONS={
  T3:{cat:'center'},
  T6:{cat:'stage'},T7:{cat:'stage'},T5:{cat:'stage'},
  T4B:{cat:'dance'},T4A:{cat:'dance'},
  T1:{cat:'front'},T2:{cat:'front'},
  D1:{cat:'patio'},D2:{cat:'patio'},D3:{cat:'patio'},
  T8:{cat:'rail'},T10:{cat:'rail'},
  T11:{cat:'up',pax:8,min:1000},T12:{cat:'up',pax:8,min:1000},
  T13:{cat:'up'},T14:{cat:'up'},T15:{cat:'up'}
};
/* ============================================================================================ */

const $=id=>document.getElementById(id);
const fmt=n=>'$'+Number(n).toLocaleString('en-US');
let selected=null;
const params=new URLSearchParams(window.location.search);
const selectedEvent=params.get('event')||'';
const EVENTBRITE_FALLBACK='https://www.eventbrite.com/o/tongue-amp-groove-4990866211';
const EVENTBRITE_BY_EVENT={
  'en-vivo-wednesdays':'https://www.eventbrite.com/e/en-vivo-wednesday-salsa-wednesday-regional-mexicano-musica-tropical-tickets-1987635238504?aff=ebdsoporgprofile',
  'latin-wednesdays':'https://www.eventbrite.com/e/en-vivo-wednesday-salsa-wednesday-regional-mexicano-musica-tropical-tickets-1987635238504?aff=ebdsoporgprofile',
  'perreologia':'https://www.eventbrite.com/e/perreologia-dime-turbo-official-dj-of-clarent-after-party-russo-in-joint-tickets-1993937463629?aff=ebdsoporgprofile',
  'ladies-night':'https://www.eventbrite.com/e/ladies-night-at-tongue-groove-friday-with-dj-alex-heisey-tickets-1993942932988?aff=ebdsoporgprofile',
  'saturdays-at-tg':'https://www.eventbrite.com/e/satrdy-with-dj-danny-m-popup-party-in-dance-room-wdzuzn-fresh-lemxn-tickets-1993965224663?aff=ebdsoporgprofile',
  'saturday-in-the-joint':'https://www.eventbrite.com/e/satrdy-with-dj-danny-m-popup-party-in-dance-room-wdzuzn-fresh-lemxn-tickets-1993965224663?aff=ebdsoporgprofile'
};
const eventbriteUrl=EVENTBRITE_BY_EVENT[selectedEvent]||EVENTBRITE_FALLBACK;

/* tabs */
function showTab(which){
  const is3d=which==='3d';
  $('tab3d').classList.toggle('active',is3d);
  $('tabMap').classList.toggle('active',!is3d);
  $('fr3d').style.display=is3d?'block':'none';
  $('frMap').style.display=is3d?'none':'block';
  $('hint').textContent=is3d
    ?'DRAG TO ORBIT · SCROLL TO ZOOM · TAP A TABLE TO SELECT'
    :'SCROLL THE POSTER · TAP A SECTION TO SELECT';
  if(!is3d){
    /* ask the map to re-measure now that it's visible (mobile stacked layout);
       retry a few times in case the iframe is still loading */
    [80,400,1200].forEach(t=>setTimeout(()=>{try{$('frMap').contentWindow.postMessage({type:'tng-map-measure'},'*');}catch(e){}},t));
  }
}
$('tab3d').addEventListener('click',()=>showTab('3d'));
$('tabMap').addEventListener('click',()=>showTab('map'));

/* messages from the embedded pickers */
window.addEventListener('message',e=>{
  const okOrigin=(e.origin===window.location.origin)||window.location.protocol==='file:';
  if(!okOrigin)return;
  const d=e.data;
  if(!d||typeof d.type!=='string'||d.type.indexOf('tng-')!==0)return;
  if(d.type==='tng-3d-select'||d.type==='tng-map-select'){
    setSelection(d.sectionId?String(d.sectionId).toUpperCase():null);
  }
  if(d.type==='tng-3d-request'||d.type==='tng-map-request'){
    setSelection(String(d.sectionId).toUpperCase());
    openModal();
  }
  if(d.type==='tng-map-height'&&d.h>0){
    /* on phones the 2D map stacks the floors vertically — grow the iframe to fit */
    $('frMap').style.height=d.mobile?Math.min(d.h,2600)+'px':'';
  }
});

function setSelection(id){
  if(id&&!SECTIONS[id])return;
  selected=id;
  if(!id){$('selBar').classList.remove('open');return;}
  const s=SECTIONS[id],c=CATS[s.cat];
  const pax=s.pax||c.pax,min=s.min||c.min;
  $('selDot').style.background=c.color;$('selDot').style.color=c.color;
  $('selName').textContent=c.label+' · '+id;
  $('selMeta').textContent=pax+' guests · '+fmt(min)+' minimum';
  $('selBar').classList.add('open');
}

/* modal */
function openModal(){
  if(!selected)return;
  const s=SECTIONS[selected],c=CATS[s.cat];
  $('mSub').textContent=c.label+' · '+selected+' — '+fmt(s.min||c.min)+' minimum';
  $('fParty').placeholder=String(s.pax||c.pax);
  $('veil').classList.add('open');
}
function closeModal(){$('veil').classList.remove('open');}
$('selBtn').addEventListener('click',openModal);
$('mX').addEventListener('click',closeModal);
$('veil').addEventListener('click',e=>{if(e.target===$('veil'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

$('mSend').addEventListener('click',()=>{
  const name=$('fName'),phone=$('fPhone');
  let ok=true;
  [name,phone].forEach(f=>{
    if(!f.value.trim()){f.classList.add('err');ok=false;}
    else f.classList.remove('err');
  });
  if(!ok)return;
  const s=SECTIONS[selected],c=CATS[s.cat];
  const payload={
    venue:'tongue-and-groove-atl',
    event:selectedEvent,
    eventbriteUrl,
    section:selected,
    sectionName:c.label,
    minimum:s.min||c.min,
    name:name.value.trim(),
    phone:phone.value.trim(),
    email:$('fEmail').value.trim(),
    partySize:$('fParty').value.trim()||String(s.pax||c.pax),
    date:$('fDate').value,
    promoter:$('fPromoter').value,
    notes:$('fNotes').value.trim(),
    submittedAt:new Date().toISOString()
  };
  /* ── wire this to your backend ───────────────────────────────
     fetch('/api/vip-request',{method:'POST',
       headers:{'Content-Type':'application/json'},
       body:JSON.stringify(payload)});
     ───────────────────────────────────────────────────────────── */
  console.log('TNG_BOOKING_REQUEST',payload);
  closeModal();
  ['fName','fPhone','fEmail','fParty','fDate','fPromoter','fNotes'].forEach(id=>$(id).value='');
  toast('Request received for '+selected+' — taking you to Eventbrite to finish your booking…');
  setTimeout(()=>{window.location.href=eventbriteUrl;},1800);
});

let toastT=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);
}
</script>
</body>
</html>
