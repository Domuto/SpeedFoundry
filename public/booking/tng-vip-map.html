<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tongue &amp; Groove — VIP Floor Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0a0912; --panel:#12101d; --line:#2a2440;
    --gold:#d4a857; --champ:#f0dcb0; --ink:#cfc8e0; --dim:#8d84a8;
    --magenta:#FF3D8D; --teal:#2DD4CF;
    --c-center:#F2C14E; --c-stage:#FF3D8D; --c-dance:#2DD4CF; --c-front:#A78BFA;
    --c-patio:#4ADE80; --c-rail:#FB923C; --c-up:#60A5FA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:10px 10px 130px}
  svg{width:100%;height:auto;display:block}

  /* ---- zones ---- */
  .zone{cursor:pointer}
  .zone .zshape{transition:filter .15s,stroke-width .15s}
  .zone:hover .zshape{filter:url(#glow)}
  .zone.sel .zshape{stroke:#fff;stroke-width:3;filter:url(#glow)}
  .zone.sold{opacity:.38;cursor:default}
  .zone.sold:hover .zshape{filter:none}
  .zid{font-family:'Cinzel',serif;font-weight:700;fill:var(--champ);text-anchor:middle;pointer-events:none}
  .zsub{font-family:'Jost',sans-serif;fill:#b9b0d2;text-anchor:middle;letter-spacing:.06em;pointer-events:none}
  .ghost{font-family:'Cinzel',serif;fill:#ffffff10;text-anchor:middle;letter-spacing:.35em;pointer-events:none}
  .flabel{font-family:'Jost',sans-serif;fill:#6f6690;letter-spacing:.32em;text-anchor:middle;pointer-events:none}
  .stamp{font-family:'Cinzel',serif;font-weight:900;fill:#ff5470;text-anchor:middle;pointer-events:none;letter-spacing:.12em}
  body.embed .hdr{display:none}

  /* ---- bottom sheet ---- */
  #sheet{position:fixed;left:50%;bottom:-160px;transform:translateX(-50%);width:min(680px,94vw);
    background:linear-gradient(180deg,#191527f2,#0e0b18f6);border:1px solid #3a3157;border-bottom:none;
    border-radius:18px 18px 0 0;padding:16px 20px 18px;backdrop-filter:blur(10px);
    transition:bottom .28s cubic-bezier(.2,.8,.2,1);z-index:40;box-shadow:0 -14px 50px #000c}
  #sheet.open{bottom:0}
  .shRow{display:flex;align-items:center;gap:14px}
  #shDot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
  #shName{font-family:'Cinzel',serif;font-weight:700;color:var(--champ);font-size:19px;letter-spacing:.04em}
  #shMeta{color:var(--dim);font-size:13.5px;letter-spacing:.05em;margin-top:2px}
  #shDesc{color:#a89dc6;font-size:13px;margin-top:8px;line-height:1.45}
  #shBtn{margin-top:12px;width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;
    font-family:'Cinzel',serif;font-weight:700;letter-spacing:.14em;font-size:14px;
    background:linear-gradient(90deg,#b8893d,#e9c87e,#b8893d);color:#1b1206}
  #shBtn:active{transform:scale(.985)}
  #shX{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid #4a4066;color:#b9b0d2;border-radius:8px;
    width:30px;height:30px;cursor:pointer;line-height:1}

  /* ---- toast ---- */
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);
    background:#191527;border:1px solid var(--gold);color:var(--champ);padding:11px 22px;border-radius:999px;
    font-size:13.5px;letter-spacing:.06em;transition:transform .3s;z-index:60;box-shadow:0 8px 30px #000a}
  #toast.show{transform:translateX(-50%) translateY(0)}

  body.embed .wrap{padding-bottom:14px}
  body.embed #sheet{display:none}
</style>
</head>
<body>
<div class="wrap">
<svg id="plan" viewBox="0 72 1440 1178" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tongue and Groove VIP floor map">
  <defs>

    </filter>
    <radialGradient id="barGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b04e" stop-opacity=".34"/>
      <stop offset="55%" stop-color="#f2b04e" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#f2b04e" stop-opacity="0"/>

    <rect class="zshape" x="1288" y="700" width="80" height="60" rx="10" fill="#60A5FA16" stroke="var(--c-up)" stroke-width="2"/>
    <text class="zid" x="1328" y="727" font-size="15">T15</text>
    <text class="zsub" x="1328" y="744" font-size="8.5">6 · $800</text>
  </g>

  <!-- ============ LEGEND (right column, below upstairs) ============ -->
  <text x="1195" y="850" class="flabel" font-size="12">LEGEND</text>
  <g font-family="Jost,sans-serif" font-size="11.5" letter-spacing=".08em" fill="#b9b0d2">
    <circle cx="1030" cy="878" r="5" fill="var(--c-center)"/><text x="1044" y="882">CENTER BOOTH</text>
    <circle cx="1030" cy="906" r="5" fill="var(--c-stage)"/><text x="1044" y="910">STAGE</text>
    <circle cx="1030" cy="934" r="5" fill="var(--c-dance)"/><text x="1044" y="938">DANCE FLOOR</text>
    <circle cx="1030" cy="962" r="5" fill="var(--c-front)"/><text x="1044" y="966">FRONT ROOM</text>
    <circle cx="1220" cy="878" r="5" fill="var(--c-patio)"/><text x="1234" y="882">PATIO</text>
    <circle cx="1220" cy="906" r="5" fill="var(--c-rail)"/><text x="1234" y="910">BALCONY RAIL</text>
    <circle cx="1220" cy="934" r="5" fill="var(--c-up)"/><text x="1234" y="938">UPSTAIRS LOUNGE</text>
  </g>
  <text x="1195" y="1012" class="flabel" font-size="10.5">TAP A SECTION TO BOOK</text>
  </g>

  <text x="720" y="1232" text-anchor="middle" font-family="Jost,sans-serif" font-size="11" fill="#57506e" letter-spacing=".3em">SATURDAY NIGHTS · 10PM – 3AM · 21+</text>
</svg>
</div>

<!-- bottom booking sheet -->
<div id="sheet">
  <div class="shRow">
    <div id="shDot"></div>
    <div>
      <div id="shName">—</div>
      <div id="shMeta">—</div>
    </div>
    <button id="shX" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div id="shDesc"></div>
  <button id="shBtn">REQUEST THIS SECTION</button>
</div>

<div id="toast">Request sent</div>

<script>
/* ================= CONFIG — edit prices / capacities / sold-out here ================= */
const CATS={
  center:{label:'Center Booth',   color:'#F2C14E',pax:12,min:2500,desc:'Wrap-around banquette at the glowing round bar — the whole room revolves around you.'},
  stage: {label:'Stage Table',    color:'#FF3D8D',pax:10,min:2000,desc:'Front-line bottle service beside the stage and DJ booth.'},
  dance: {label:'Dance Floor Table',color:'#2DD4CF',pax:8,min:1500,desc:'Right on the dance floor rail — in the middle of everything.'},
  front: {label:'Front Room Table',color:'#A78BFA',pax:8,min:1200,desc:'First tables past the main door — easy in, easy out, full view.'},
  patio: {label:'Patio Section',  color:'#4ADE80',pax:10,min:1000,desc:'Open-air section under the string lights on the patio.'},
  rail:  {label:'Balcony Rail Booth',color:'#FB923C',pax:8,min:1800,desc:'Curved balcony booth on the rail, overlooking the main floor.'},
  up:    {label:'Upstairs Lounge',color:'#60A5FA',pax:6,min:800, desc:'Upstairs lounge table with its own bar, above the noise.'}
};
const SECTIONS={
  T3:{cat:'center'},
  T6:{cat:'stage'},T7:{cat:'stage'},T5:{cat:'stage'},
  T4B:{cat:'dance'},T4A:{cat:'dance'},
  T1:{cat:'front'},T2:{cat:'front'},
  D1:{cat:'patio'},D2:{cat:'patio'},D3:{cat:'patio'},
  T8:{cat:'rail'},T10:{cat:'rail'},
  T11:{cat:'up',pax:8,min:1000},T12:{cat:'up',pax:8,min:1000},
  T13:{cat:'up'},T14:{cat:'up'},T15:{cat:'up'}
};
const SOLD_OUT=[];   /* e.g. ['T3','D2'] */
/* ===================================================================================== */

const PARAMS=new URLSearchParams(location.search);
const EMBED=PARAMS.get('embed')==='1';
const ORIGIN=window.location.origin;
const TARGET_ORIGIN=(ORIGIN&&ORIGIN!=='null')?ORIGIN:'*';
if(EMBED){
  document.body.classList.add('embed');
}

/* Responsive layout: on phones, move the upstairs panel + legend below the
   main floor (scaled up 2x) so guests scroll down instead of pinching. */
const planSvg=document.getElementById('plan');
const gUp=document.getElementById('gUpstairs');
function layoutPlan(){
  const mobile=window.matchMedia('(max-width:720px)').matches;
  if(mobile){
    /* upstairs group native origin ≈ (1000,210); scale 2× and park it at (40,1290) */
    gUp.setAttribute('transform','translate(-1960,870) scale(2)');
    planSvg.setAttribute('viewBox',EMBED?'0 172 1000 2770':'0 72 1000 2870');
  }else{
    gUp.removeAttribute('transform');
    planSvg.setAttribute('viewBox',EMBED?'0 172 1440 1078':'0 72 1440 1178');
  }
  if(EMBED&&window.parent!==window){
    setTimeout(()=>{
      try{window.parent.postMessage({type:'tng-map-height',mobile,h:document.documentElement.scrollHeight},TARGET_ORIGIN);}catch(e){}
    },60);
  }
}
layoutPlan();
window.addEventListener('resize',layoutPlan);
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='tng-map-measure')layoutPlan();
});

const $=id=>document.getElementById(id);
const fmt=n=>'$'+Number(n).toLocaleString('en-US');
let selected=null;

const zones={};
document.querySelectorAll('.zone').forEach(z=>{
  const id=z.getAttribute('data-id');
  zones[id]=z;
  z.addEventListener('click',()=>{
    if(z.classList.contains('sold'))return;
    select(id);
  });
});

/* sold-out stamps */
function shapeCenter(shape){
  try{
    if(shape.tagName==='circle')
      return {x:+shape.getAttribute('cx'),y:+shape.getAttribute('cy')};
    if(shape.tagName==='rect')
      return {x:+shape.getAttribute('x')+ +shape.getAttribute('width')/2,
              y:+shape.getAttribute('y')+ +shape.getAttribute('height')/2};
    const b=shape.getBBox();return {x:b.x+b.width/2,y:b.y+b.height/2};
  }catch(e){return null;}
}
SOLD_OUT.forEach(id=>{
  const z=zones[id];if(!z)return;
  z.classList.add('sold');
  const c=shapeCenter(z.querySelector('.zshape'));if(!c)return;
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',c.x);
  t.setAttribute('y',c.y+8);
  t.setAttribute('class','stamp');
  t.setAttribute('font-size','24');
  t.setAttribute('transform','rotate(-14 '+c.x+' '+c.y+')');
  t.textContent='SOLD';
  z.appendChild(t);
});

function select(id){
  if(selected&&zones[selected])zones[selected].classList.remove('sel');
  selected=id;
  if(id&&zones[id])zones[id].classList.add('sel');
  if(EMBED){
    try{window.parent.postMessage({type:'tng-map-select',sectionId:id?String(id).toLowerCase():null},TARGET_ORIGIN);}catch(e){}
    return;
  }
  if(!id){$('sheet').classList.remove('open');return;}
  const s=SECTIONS[id],c=CATS[s.cat];
  const pax=s.pax||c.pax,min=s.min||c.min;
  $('shDot').style.background=c.color;$('shDot').style.color=c.color;
  $('shName').textContent=c.label+' · '+id;
  $('shMeta').textContent=pax+' guests · '+fmt(min)+' minimum';
  $('shDesc').textContent=c.desc;
  $('sheet').classList.add('open');
}

$('shX').addEventListener('click',()=>select(null));
document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null);});

$('shBtn').addEventListener('click',()=>{
  if(!selected)return;
  if(EMBED){
    try{window.parent.postMessage({type:'tng-map-request',sectionId:String(selected).toLowerCase()},TARGET_ORIGIN);}catch(e){}
    return;
  }
  toast('Request noted for '+selected+' — connect this button to your booking flow.');
});

let toastT=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
</script>
</body>
</html>
